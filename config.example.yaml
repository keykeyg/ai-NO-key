# AI No Key — Configuration

cameras_root: "data/cameras"
output_dir: "data/output"
profiles_dir: "data/profiles"

model: "yolo11m.pt"
classes: [0]
conf: 0.4
tracker: "bytetrack.yaml"
frame_skip: 2

reid:
  # osnet = real person ReID (requires torchreid). Falls back to enhanced automatically.
  body_method: "osnet"
  face_backend: "none"          # none | insightface | weak
  face_weight: 0.15
  match_threshold: 0.50         # slightly lower OK with OSNet
  strong_match_threshold: 0.65
  max_time_gap_seconds: 420
  device: "cuda"

topology:
  enabled: true
  max_transition_seconds: 180
  cameras:
    - bar_main
    - bar_service
    - hookah
    - kitchen
    - office
    - entrance
    - patio
  transitions:
    bar_main: [bar_service, hookah, entrance, patio]
    bar_service: [bar_main, kitchen]
    hookah: [bar_main, entrance, patio]
    kitchen: [bar_service, office]
    office: [kitchen]
    entrance: [bar_main, hookah, patio]
    patio: [bar_main, hookah, entrance]

save_track_clips: true
clip_padding_seconds: 1.5
max_clip_duration: 40
log_level: "INFO"
