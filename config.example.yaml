# AI No Key — Mac / Apple Silicon optimized
# Branch: mac

cameras_root: "data/cameras"
output_dir: "data/output"
profiles_dir: "data/profiles"
timezone: "America/Chicago"

# Default search path:
#   nvr   = pull ONLY the time window you ask for from UniFi/Frigate (preferred)
#   local = use clips already dropped under data/cameras/
source_mode: nvr

model: "yolo11s.pt"
classes: [0]
conf: 0.4
tracker: "bytetrack.yaml"
frame_skip: 3
device: "mps"

reid:
  body_method: "osnet"
  face_backend: "none"
  face_weight: 0.15
  match_threshold: 0.50
  strong_match_threshold: 0.65
  max_time_gap_seconds: 420
  device: "mps"

# UniFi Protect / Frigate — used when source_mode is nvr
nvr:
  type: unifi                 # unifi | frigate
  host: "192.168.1.1"         # Protect / UniFi OS IP (or reachable hostname)
  port: 443
  username: ""                # or env UNIFI_USERNAME / .unifi.env
  password: ""                # or env UNIFI_PASSWORD / .unifi.env
  verify_ssl: false
  chunk_minutes: 15           # pull in 15-min pieces so you never download 90GB at once
  cameras:                    # Protect camera name → local folder
    "Downstairs Across Hookah D1": hookah
    "Bar Main": bar_main
    "Bar Service": bar_service
    "Kitchen": kitchen
    "Office": office
    "Entrance": entrance
    "Patio": patio

topology:
  enabled: true
  max_transition_seconds: 180
  cameras:
    - bar_main
    - bar_service
    - hookah
    - kitchen
    - office
    - entrance
    - patio
  transitions:
    bar_main: [bar_service, hookah, entrance, patio]
    bar_service: [bar_main, kitchen]
    hookah: [bar_main, entrance, patio]
    kitchen: [bar_service, office]
    office: [kitchen]
    entrance: [bar_main, hookah, patio]
    patio: [bar_main, hookah, entrance]

save_track_clips: true
clip_padding_seconds: 1.5
max_clip_duration: 40
log_level: "INFO"
