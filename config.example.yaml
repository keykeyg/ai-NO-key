# AI No Key — Configuration

cameras_root: "data/cameras"
output_dir: "data/output"
profiles_dir: "data/profiles"

model: "yolo11m.pt"
classes: [0]
conf: 0.4
tracker: "bytetrack.yaml"
frame_skip: 2

reid:
  body_method: "enhanced"       # enhanced | osnet (osnet not wired yet)
  # Face: keep "none" until InsightFace is installed and tested
  face_backend: "none"          # none | insightface | weak
  face_weight: 0.15             # how much face can influence score (keep low)
  match_threshold: 0.52
  strong_match_threshold: 0.68
  max_time_gap_seconds: 420

topology:
  enabled: true
  max_transition_seconds: 180
  cameras:
    - bar_main
    - bar_service
    - hookah
    - kitchen
    - office
    - entrance
    - patio
  transitions:
    bar_main: [bar_service, hookah, entrance, patio]
    bar_service: [bar_main, kitchen]
    hookah: [bar_main, entrance, patio]
    kitchen: [bar_service, office]
    office: [kitchen]
    entrance: [bar_main, hookah, patio]
    patio: [bar_main, hookah, entrance]

save_track_clips: true
clip_padding_seconds: 1.5
max_clip_duration: 40
log_level: "INFO"
